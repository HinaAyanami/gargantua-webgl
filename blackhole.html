<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gargantua · 卡冈图雅</title>
<style>
  :root{
    --fg:#eae7e2;
    --muted:#958f88;
    --accent:#ffb470;
    --line:rgba(255,255,255,.13);
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;height:100%;background:#000;overflow:hidden;color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  canvas#gl.drag{cursor:grabbing}

  /* 启动遮罩：避免打开瞬间的突兀 */
  #veil{position:fixed;inset:0;z-index:30;background:#000;display:flex;align-items:center;justify-content:center;
    transition:opacity 1.5s cubic-bezier(.4,0,.2,1);pointer-events:none}
  #veil.hide{opacity:0}
  #veil span{font-size:10px;letter-spacing:.55em;text-indent:.55em;color:#5f5a55}

  #title{position:fixed;left:26px;top:22px;z-index:10;pointer-events:none;
    opacity:0;transform:translateY(4px);transition:opacity 1.6s ease .9s,transform 1.6s ease .9s}
  #title.on{opacity:1;transform:none}
  #title h1{margin:0;font-size:12.5px;font-weight:500;letter-spacing:.44em;color:rgba(255,255,255,.8)}
  #title p{margin:7px 0 0;font-size:10.5px;letter-spacing:.1em;color:var(--muted)}

  #hint{position:fixed;left:26px;bottom:22px;z-index:10;font-size:10.5px;letter-spacing:.09em;color:#6d6862;
    opacity:0;transition:opacity 1.2s ease 2s;pointer-events:none}
  #hint.on{opacity:1}

  #panel{position:fixed;right:18px;bottom:18px;z-index:20;width:232px;
    background:rgba(10,10,13,.52);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);
    border:1px solid var(--line);border-radius:14px;padding:11px 13px 12px;
    opacity:0;transform:translateY(8px);transition:opacity .9s ease 1.1s,transform .9s ease 1.1s}
  #panel.on{opacity:1;transform:none}
  .phead{display:flex;align-items:center;justify-content:space-between;padding-bottom:8px;
    border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:4px}
  .phead b{font-size:10.5px;font-weight:500;letter-spacing:.2em;color:#b8b2ab}
  .fold{cursor:pointer;color:#7d7771;font-size:13px;line-height:1;padding:2px 4px;border-radius:6px;user-select:none}
  .fold:hover{color:#ddd;background:rgba(255,255,255,.06)}
  #body{overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1),opacity .3s;max-height:340px}
  #body.closed{max-height:0;opacity:0}

  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0}
  .row>span{font-size:11px;letter-spacing:.06em;color:var(--muted)}
  .sl{padding:6px 0 2px}
  .sl .lab{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.06em;color:var(--muted);margin-bottom:5px}
  .sl .lab i{font-style:normal;color:#cfc9c2;font-variant-numeric:tabular-nums}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:2px;
    background:rgba(255,255,255,.16);outline:none;margin:4px 0 2px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
    background:#e8e2da;cursor:pointer;box-shadow:0 0 0 3px rgba(255,180,112,.14)}
  input[type=range]::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:#e8e2da;cursor:pointer}

  .sw{position:relative;flex:none;width:32px;height:17px;border-radius:9px;background:rgba(255,255,255,.13);
    cursor:pointer;transition:background .22s}
  .sw::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;
    background:#b9b3ac;transition:transform .22s,background .22s}
  .sw.on{background:rgba(255,170,100,.5)}
  .sw.on::after{transform:translateX(15px);background:#fff}

  .btn{margin-top:8px;width:100%;padding:6px 0;border:1px solid var(--line);border-radius:8px;
    background:rgba(255,255,255,.03);color:#a9a39c;font-size:11px;letter-spacing:.1em;cursor:pointer;
    transition:background .2s,color .2s;font-family:inherit}
  .btn:hover{background:rgba(255,255,255,.08);color:#eae7e2}
  .stat{margin-top:9px;padding-top:8px;border-top:1px solid rgba(255,255,255,.08);
    display:flex;justify-content:space-between;font-size:10px;color:#5f5a55;font-variant-numeric:tabular-nums}

  #err{position:fixed;inset:auto 0 0 0;z-index:40;padding:14px 18px;background:rgba(60,10,10,.92);
    color:#ffb3b3;font:11px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;display:none;
    max-height:42vh;overflow:auto}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="title">
  <h1>GARGANTUA</h1>
  <p>史瓦西黑洞 · 实时引力透镜</p>
</div>

<div id="hint">拖动旋转 · 滚轮缩放</div>

<div id="panel">
  <div class="phead"><b>CONTROL</b><div class="fold" id="fold">–</div></div>
  <div id="body">
    <div class="row"><span>吸积盘</span><div class="sw on" id="swDisk"></div></div>
    <div class="row"><span>自动旋转</span><div class="sw on" id="swAuto"></div></div>
    <div class="sl">
      <div class="lab"><span>画质 / 积分步数</span><i id="vSteps">220</i></div>
      <input type="range" id="rSteps" min="120" max="360" step="10" value="220">
    </div>
    <div class="sl">
      <div class="lab"><span>曝光</span><i id="vExp">0.85</i></div>
      <input type="range" id="rExp" min="30" max="260" step="5" value="85">
    </div>
    <div class="sl">
      <div class="lab"><span>星场亮度</span><i id="vStar">1.0</i></div>
      <input type="range" id="rStar" min="0" max="200" step="5" value="100">
    </div>
    <button class="btn" id="btnReset">重置视角</button>
    <div class="stat"><span id="sFps">-- fps</span><span id="sRes">--</span></div>
  </div>
</div>

<div id="err"></div>
<div id="veil"><span>GARGANTUA</span></div>

<script id="vsh" type="x-shader/x-vertex">
#version 300 es
layout(location=0) in vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }
</script>

<script id="fsh" type="x-shader/x-fragment">
#version 300 es
precision highp float;
precision highp int;

out vec4 fragColor;

uniform vec2  uRes;
uniform float uTime;
uniform vec3  uCamPos;
uniform vec3  uCamFwd;
uniform vec3  uCamRight;
uniform vec3  uCamUp;
uniform float uTanHalf;
uniform int   uSteps;
uniform float uDiskIn;
uniform float uDiskOut;
uniform float uDiskOn;
uniform float uExposure;
uniform float uStarBright;
uniform float uDiskBright;

const float RS      = 1.0;    // 史瓦西半径（几何单位 G=c=1, rs=2M）
const float ESCAPE  = 46.0;   // 逃逸判定半径
const float DISK_Y  = 0.0;    // 吸积盘平面 y=0

/* ================= 噪声 ================= */
float hash13(vec3 p3){
  p3 = fract(p3 * 0.1031);
  p3 += dot(p3, p3.zyx + 31.32);
  return fract((p3.x + p3.y) * p3.z);
}
vec3 hash33(vec3 p3){
  p3 = fract(p3 * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yxz + 33.33);
  return fract((p3.xxy + p3.yxx) * p3.zyx);
}
float vnoise(vec3 x){
  vec3 i = floor(x);
  vec3 f = fract(x);
  f = f * f * (3.0 - 2.0 * f);
  float a = mix(mix(hash13(i + vec3(0,0,0)), hash13(i + vec3(1,0,0)), f.x),
                mix(hash13(i + vec3(0,1,0)), hash13(i + vec3(1,1,0)), f.x), f.y);
  float b = mix(mix(hash13(i + vec3(0,0,1)), hash13(i + vec3(1,0,1)), f.x),
                mix(hash13(i + vec3(0,1,1)), hash13(i + vec3(1,1,1)), f.x), f.y);
  return mix(a, b, f.z);
}
float fbm(vec3 p){
  float s = 0.0, a = 0.5, n = 0.0;
  for (int i = 0; i < 4; i++){
    s += a * vnoise(p);
    n += a;
    p = p * 2.03 + 1.7;
    a *= 0.5;
  }
  return s / max(n, 1e-5);
}

/* ================= 星空 ================= */
vec3 starLayer(vec3 d, float sc, float th, float bright, float seed){
  vec3 p  = d * sc + seed;
  vec3 id = floor(p);
  vec3 f  = fract(p) - 0.5;
  vec3 h  = hash33(id + seed);
  if (h.x < th) return vec3(0.0);

  vec3  off = (vec3(h.y, h.z, hash13(id + seed * 3.1 + 4.4)) - 0.5) * 0.74;
  vec3  dv  = f - off;
  float d2  = dot(dv, dv);
  float b   = (h.x - th) / max(1.0 - th, 1e-4);
  b = pow(b, 1.35);

  float core = exp(-d2 * 210.0);
  float halo = exp(-d2 * mix(70.0, 16.0, b)) * (0.16 + 0.34 * b);
  // 十字衍射星芒：让亮星看起来像星而不是噪点（只给大尺度那一层）
  float t1 = dv.x * dv.x + dv.z * dv.z;
  float t2 = dv.y * dv.y + dv.z * dv.z;
  float spk = (exp(-abs(dv.y) * 5.0) * exp(-t1 * 210.0)
             + exp(-abs(dv.x) * 5.0) * exp(-t2 * 210.0)) * 0.22;
  float spike = spk * (1.0 - smoothstep(28.0, 70.0, sc));

  float amt = (core + halo + spike) * b * bright * uStarBright;

  vec3 tint = mix(vec3(0.66, 0.78, 1.0), vec3(1.0, 0.74, 0.48), hash13(id * 1.7 + seed));
  tint = mix(tint, vec3(1.0), 0.45);
  return tint * amt * 2.4;
}

vec3 starField(vec3 d){
  vec3 col = vec3(0.0);

  // 淡银河带
  vec3  axis = normalize(vec3(0.42, 0.86, -0.29));
  float band = exp(-pow(dot(d, axis) * 2.15, 2.0));
  float n1 = fbm(d * 3.1 + 5.0);
  float n2 = fbm(d * 8.7 + 21.0);
  vec3  neb = mix(vec3(0.09, 0.12, 0.25), vec3(0.31, 0.22, 0.30), n1);
  col += neb * band * (0.18 + 1.3 * n1) * (0.22 + 0.85 * n2) * uStarBright * 0.07;

  // 三层星点：越细密的一层越小越暗
  col += starLayer(d,  22.0, 0.945, 1.20, 0.0);
  col += starLayer(d,  48.0, 0.925, 1.10, 3.7);
  col += starLayer(d, 110.0, 0.900, 0.95, 9.1);
  return col;
}

/* ================= 吸积盘 ================= */
// 返回 rgb=发射亮度, a=不透明度
vec4 diskSample(vec3 p, vec3 rayDir, float r){
  float phi   = atan(p.z, p.x);
  // 开普勒角速度 w = sqrt(M)/r^1.5 , M = rs/2 = 0.5（差速旋转 → 剪切细丝）
  float omega = 0.72 * pow(r, -1.5);
  float ang   = phi - omega * uTime * 1.7;
  float lr    = log(r);
  float ca = cos(ang), sa = sin(ang);

  // 各向异性湍流：径向频率高、角向频率低 → 沿方位角被剪切拉伸的丝状结构
  vec3  nqA  = vec3(ca * 1.70, lr * 4.20, sa * 1.70);
  float n1   = fbm(nqA * 0.80);
  float n2   = fbm(nqA * 2.45 + 17.3);
  float n3   = fbm(nqA * 7.30 + 51.7);
  vec3  nqB  = vec3(ca * 3.10, lr * 18.0, sa * 3.10);   // 差速旋转剪切出的细密丝状结构
  float fil  = fbm(nqB);
  float turb = 0.34 * n1 + 0.20 * n2 + 0.16 * n3 + 0.62 * fil;
  turb = smoothstep(0.28, 0.78, turb);

  // 径向轮廓：内缘锐利、外缘渐隐
  float edgeIn  = smoothstep(uDiskIn, uDiskIn * 1.05, r);
  float edgeOut = 1.0 - smoothstep(uDiskOut * 0.52, uDiskOut, r);

  float dens = (0.05 + 2.10 * turb) * edgeIn * edgeOut;
  dens = clamp(dens, 0.0, 1.5);

  // 径向温度梯度 + ISCO 内缘增亮
  float rad  = clamp((r - uDiskIn) / max(uDiskOut - uDiskIn, 1e-3), 0.0, 1.0);
  float ring = 1.0 + 1.35 * exp(-pow((r - uDiskIn * 1.08) / (uDiskIn * 0.10), 2.0));
  float I    = pow(uDiskIn / r, 2.1) * (0.50 + 0.95 * n2) * ring;

  vec3 c = mix(vec3(1.00, 0.97, 0.93), vec3(1.00, 0.66, 0.26), smoothstep(0.0, 0.26, rad));
  c = mix(c, vec3(0.94, 0.35, 0.11), smoothstep(0.22, 0.85, rad));
  c = mix(c, vec3(0.52, 0.15, 0.06), smoothstep(0.68, 1.0, rad));
  // 湍流热斑：密处更热更白、疏处更暗更红 → 可见的色度纹理
  c = mix(c * vec3(0.72, 0.52, 0.44), c, clamp(turb * 1.45, 0.0, 1.0));
  c = mix(c, vec3(1.00, 0.94, 0.82), 0.45 * turb);

  // 多普勒 + 引力红移
  vec3  rhat   = normalize(vec3(p.x, 0.0, p.z));
  vec3  phihat = normalize(cross(rhat, vec3(0.0, 1.0, 0.0)));
  float beta   = min(sqrt(0.5 / max(r, 1.15)), 0.78);
  float gam    = 1.0 / sqrt(max(1.0 - beta * beta, 1e-4));
  float dop    = 1.0 / max(gam * (1.0 + dot(phihat * beta, rayDir)), 1e-3);
  float grav   = sqrt(max(1.0 - RS / max(r, RS * 1.001), 0.0));
  float shift  = clamp(dop * mix(1.0, grav, 0.6), 0.5, 1.9);
  float boost  = pow(shift, 2.6);

  vec3  emis  = c * I * boost * dens * uDiskBright * 1.05;
  float pathL = clamp(0.5 / max(abs(rayDir.y), 0.06), 0.6, 6.0);
  float alpha = clamp(dens * pathL * 0.34, 0.0, 1.0);

  return vec4(emis * uDiskOn, alpha * uDiskOn);
}

/* ================= 色调映射 ================= */
vec3 aces(vec3 x){
  const float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14;
  return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
}

uniform float uTonemap;   // 1 = 自行色调映射（无泛光直出）

/* ================= 主函数 ================= */
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  vec3 rd = normalize(uCamFwd + uTanHalf * (uv.x * uCamRight + uv.y * uCamUp));

  vec3  pos = uCamPos;
  vec3  vel = rd;
  // 逃逸半径随相机距离自适应：拉远后整个场景仍要能渲染完
  float escR = max(ESCAPE, length(uCamPos) * 1.30 + 8.0);
  vec3  hv  = cross(pos, vel);
  float h2  = dot(hv, hv);        // 角动量平方（沿测地线守恒）

  vec3  col   = vec3(0.0);
  float trans = 1.0;
  bool  captured = false;

  for (int i = 0; i < 400; i++){
    if (i >= uSteps) break;

    float r = length(pos);
    if (r < RS * 1.02) { captured = true; break; }   // 落入视界
    if (r > escR) break;                            // 逃逸
    if (r > 26.0 && dot(pos, vel) > 0.0) break;     // 远离且足够远，提前结束

    // 自适应步长：近处细、远处粗
    float dt = 0.075 * r * clamp(r / 8.0, 0.14, 1.0);
    dt = clamp(dt, 0.012, max(1.2, r * 0.075));   // 远处放宽步长上限，拉远时仍能在限定步数内收敛

    // 零测地线在弱场近似下的加速度: a = -1.5 * h^2 * r_vec / r^5
    float r2 = r * r;
    float r5 = r2 * r2 * r;
    vec3  a0 = -1.5 * h2 * pos / r5;

    vec3 npos = pos + vel * dt + 0.5 * a0 * dt * dt;
    float nr  = length(npos);
    float nr2 = nr * nr;
    vec3  a1  = -1.5 * h2 * npos / (nr2 * nr2 * nr);
    vec3 nvel = vel + 0.5 * (a0 + a1) * dt;

    // 穿过吸积盘平面 → 采样
    if (pos.y * npos.y < DISK_Y) {
      float t  = pos.y / (pos.y - npos.y);
      vec3  hp = mix(pos, npos, t);
      float rdDisk = length(hp.xz);
      if (rdDisk > uDiskIn * 0.88 && rdDisk < uDiskOut * 1.02) {
        vec4 s = diskSample(hp, normalize(nvel), rdDisk);
        col   += trans * s.rgb;
        trans *= (1.0 - s.a);
      }
    }

    pos = npos;
    vel = nvel;
    if (trans < 0.004) break;
  }

  if (!captured) {
    col += trans * starField(normalize(vel));
  }

  col *= uExposure;
  if (uTonemap > 0.5){            // 开启后期泛光时，色调映射交给合成 pass
    col = aces(col);
    col = pow(max(col, 0.0), vec3(1.0 / 2.2));
  }
  fragColor = vec4(col, 1.0);
}
</script>

<!-- 后期泛光：亮度提取 → 1/4 降采样 -->
<script id="bsh" type="x-shader/x-fragment">
#version 300 es
precision highp float;
uniform sampler2D uSrc;
uniform vec2  uTexel;
uniform float uThresh;
out vec4 fragColor;
void main(){
  vec2 uv = gl_FragCoord.xy * uTexel;
  vec3 s  = texture(uSrc, uv + vec2(-0.5, -0.5) * uTexel).rgb;
  s += texture(uSrc, uv + vec2( 0.5, -0.5) * uTexel).rgb;
  s += texture(uSrc, uv + vec2(-0.5,  0.5) * uTexel).rgb;
  s += texture(uSrc, uv + vec2( 0.5,  0.5) * uTexel).rgb;
  s *= 0.25;
  float l = max(max(s.r, s.g), s.b);
  fragColor = vec4(s * (max(l - uThresh, 0.0) / max(l, 1e-4)), 1.0);
}
</script>

<!-- 后期泛光：可分离高斯模糊（5 tap 线性采样近似） -->
<script id="lsh" type="x-shader/x-fragment">
#version 300 es
precision highp float;
uniform sampler2D uSrc;
uniform vec2  uTexel;
uniform vec2  uDir;
uniform float uScale;
out vec4 fragColor;
void main(){
  vec2 uv = gl_FragCoord.xy * uTexel;
  vec2 o1 = uDir * uTexel * (1.3846153846 * uScale);
  vec2 o2 = uDir * uTexel * (3.2307692308 * uScale);
  vec3 s  = texture(uSrc, uv).rgb * 0.2270270270;
  s += (texture(uSrc, uv + o1).rgb + texture(uSrc, uv - o1).rgb) * 0.3162162162;
  s += (texture(uSrc, uv + o2).rgb + texture(uSrc, uv - o2).rgb) * 0.0702702703;
  fragColor = vec4(s, 1.0);
}
</script>

<!-- 后期合成：HDR 场景 + 泛光 → ACES 色调映射 -->
<script id="csh" type="x-shader/x-fragment">
#version 300 es
precision highp float;
uniform sampler2D uScene;
uniform sampler2D uBloom;
uniform vec2  uTexel;
uniform float uBloomAmt;
out vec4 fragColor;
vec3 aces(vec3 x){
  const float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14;
  return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
}
void main(){
  vec2 uv = gl_FragCoord.xy * uTexel;
  vec3 col = texture(uScene, uv).rgb + texture(uBloom, uv).rgb * uBloomAmt;
  col = aces(col);
  fragColor = vec4(pow(max(col, 0.0), vec3(1.0 / 2.2)), 1.0);
}
</script>

<script>
(function(){
  "use strict";

  var diag = window.__diag = { gl:false, err:null, frames:0, fps:0, w:0, h:0, steps:0 };
  window.__state = null;   // 便于调试/自动化检查相机状态
  var errBox = document.getElementById('err');
  function fail(msg){
    diag.err = String(msg);
    errBox.style.display = 'block';
    errBox.textContent = '⚠ ' + msg;
    console.error(msg);
  }

  var cv = document.getElementById('gl');
  var gl = cv.getContext('webgl2', {
    antialias:false, alpha:false, depth:false, stencil:false,
    premultipliedAlpha:false, preserveDrawingBuffer:false,
    powerPreference:'high-performance'
  });
  if (!gl) { fail('当前浏览器/设备不支持 WebGL2，无法渲染。请用较新的 Chrome / Edge / Firefox / Safari 打开。'); return; }
  diag.gl = true;

  /* ---------- 着色器 ---------- */
  function shaderSource(id){
    // 去掉 <script> 标签后的前导换行/空白，#version 必须是源码第一行
    return document.getElementById(id).textContent.replace(/^[\s\uFEFF]+/, '');
  }
  function compile(type, src, tag){
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      var log = gl.getShaderInfoLog(s) || '';
      fail(tag + ' 编译失败:\n' + log);
      return null;
    }
    return s;
  }
  var vs = compile(gl.VERTEX_SHADER, shaderSource('vsh'), 'vertex shader');
  var fs = compile(gl.FRAGMENT_SHADER, shaderSource('fsh'), 'fragment shader');
  if (!vs || !fs) return;

  var prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    fail('着色器链接失败:\n' + (gl.getProgramInfoLog(prog) || ''));
    return;
  }
  gl.useProgram(prog);

  /* ---------- 全屏三角形 ---------- */
  var vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  var vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  /* ---------- uniform ---------- */
  var names = ['uRes','uTime','uCamPos','uCamFwd','uCamRight','uCamUp','uTanHalf',
               'uSteps','uDiskIn','uDiskOut','uDiskOn','uExposure','uStarBright','uDiskBright','uTonemap'];
  var U = {};
  for (var i = 0; i < names.length; i++) U[names[i]] = gl.getUniformLocation(prog, names[i]);

  /* ---------- 后期处理：泛光（Bloom）管线 ---------- */
  var postNames = ['uSrc','uTexel','uThresh','uDir','uScale','uScene','uBloom','uBloomAmt'];
  function buildProg(fsId, tag){
    var f = compile(gl.FRAGMENT_SHADER, shaderSource(fsId), tag);
    if (!f) return null;
    var p = gl.createProgram();
    gl.attachShader(p, vs); gl.attachShader(p, f); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)){
      fail(tag + ' 链接失败:\n' + (gl.getProgramInfoLog(p) || '')); return null;
    }
    var u = {};
    for (var j = 0; j < postNames.length; j++) u[postNames[j]] = gl.getUniformLocation(p, postNames[j]);
    return { prog:p, u:u };
  }
  var hdrOK   = !!gl.getExtension('EXT_color_buffer_float');
  var brightP = buildProg('bsh', '泛光亮度提取');
  var blurP   = buildProg('lsh', '泛光模糊');
  var compP   = buildProg('csh', '后期合成');
  var post    = !!(hdrOK && brightP && blurP && compP);
  diag.hdr = hdrOK; diag.post = post;

  function mkRT(w, h){
    var tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    var fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    var ok = (gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { tex:tex, fb:fb, w:w, h:h, ok:ok };
  }
  function delRT(rt){ if (!rt) return; gl.deleteTexture(rt.tex); gl.deleteFramebuffer(rt.fb); }
  function bindTex(unit, tex, loc){
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    if (loc) gl.uniform1i(loc, unit);
  }
  var rtScene = null, rtA = null, rtB = null;

  function ensureTargets(){
    if (!post) return;
    var W = cv.width, H = cv.height;
    var bw = Math.max(2, W >> 2), bh = Math.max(2, H >> 2);
    if (!rtScene || rtScene.w !== W || rtScene.h !== H || !rtScene.ok || !rtA.ok){
      delRT(rtScene); delRT(rtA); delRT(rtB);
      rtScene = mkRT(W, H); rtA = mkRT(bw, bh); rtB = mkRT(bw, bh);
      if (!rtScene.ok || !rtA.ok || !rtB.ok){ post = false; diag.post = false; }
    }
  }

  /* ---------- 状态 ---------- */
  var state = {
    yaw:0.55, pitch:0.135, dist:25,
    tYaw:0.55, tPitch:0.135, tDist:25,
    auto:true, disk:true,
    steps:220, exposure:0.85, star:1.0,
    quality:1.0, time:0, bloom:0.85
  };
  window.__state = state;
  var DISK_IN = 3.0, DISK_OUT = 15.0;
  var FOV = 42.0 * Math.PI / 180.0;
  var tanHalf = Math.tan(FOV * 0.5);
  var MAX_PIXELS = 2.6e6;

  function clamp(v,a,b){ return v < a ? a : (v > b ? b : v); }

  /* ---------- 尺寸 / 动态分辨率 ---------- */
  function resize(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = cv.clientWidth || window.innerWidth;
    var h = cv.clientHeight || window.innerHeight;
    var pw = Math.max(2, Math.round(w * dpr * state.quality));
    var ph = Math.max(2, Math.round(h * dpr * state.quality));
    if (pw * ph > MAX_PIXELS){
      var k = Math.sqrt(MAX_PIXELS / (pw * ph));
      pw = Math.max(2, Math.round(pw * k));
      ph = Math.max(2, Math.round(ph * k));
    }
    if (cv.width !== pw || cv.height !== ph){
      cv.width = pw; cv.height = ph;
    }
    gl.viewport(0, 0, cv.width, cv.height);
    diag.w = cv.width; diag.h = cv.height;
    document.getElementById('sRes').textContent = cv.width + '×' + cv.height;
    ensureTargets();
  }
  window.addEventListener('resize', resize);

  /* ---------- 交互 ---------- */
  var dragging = false, lx = 0, ly = 0;
  cv.addEventListener('pointerdown', function(e){
    dragging = true; lx = e.clientX; ly = e.clientY;
    cv.classList.add('drag');
    try { cv.setPointerCapture(e.pointerId); } catch(_){}
  });
  cv.addEventListener('pointermove', function(e){
    if (!dragging) return;
    var dx = e.clientX - lx, dy = e.clientY - ly;
    lx = e.clientX; ly = e.clientY;
    state.tYaw -= dx * 0.005;
    state.tPitch = clamp(state.tPitch + dy * 0.0034, -1.35, 1.35);
  });
  function endDrag(e){
    dragging = false; cv.classList.remove('drag');
    try { cv.releasePointerCapture(e.pointerId); } catch(_){}
  }
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);
  cv.addEventListener('wheel', function(e){
    e.preventDefault();
    state.tDist = clamp(state.tDist * Math.exp(e.deltaY * 0.0011), 7, 80);
  }, { passive:false });

  /* ---------- UI ---------- */
  function bindSwitch(id, key, onChange){
    var el = document.getElementById(id);
    el.addEventListener('click', function(){
      var on = !el.classList.contains('on');
      el.classList.toggle('on', on);
      state[key] = on;
      if (onChange) onChange(on);
    });
  }
  bindSwitch('swDisk', 'disk');
  bindSwitch('swAuto', 'auto');

  var rSteps = document.getElementById('rSteps');
  rSteps.addEventListener('input', function(){
    state.steps = parseInt(rSteps.value, 10);
    document.getElementById('vSteps').textContent = state.steps;
    diag.steps = state.steps;
  });
  var rExp = document.getElementById('rExp');
  rExp.addEventListener('input', function(){
    state.exposure = parseInt(rExp.value, 10) / 100;
    document.getElementById('vExp').textContent = state.exposure.toFixed(2);
  });
  var rStar = document.getElementById('rStar');
  rStar.addEventListener('input', function(){
    state.star = parseInt(rStar.value, 10) / 100;
    document.getElementById('vStar').textContent = state.star.toFixed(1);
  });
  document.getElementById('btnReset').addEventListener('click', function(){
    state.tYaw = 0.55; state.tPitch = 0.135; state.tDist = 25;
  });
  var folded = false;
  document.getElementById('fold').addEventListener('click', function(){
    folded = !folded;
    document.getElementById('body').classList.toggle('closed', folded);
    this.textContent = folded ? '+' : '–';
  });

  /* ---------- 渲染 ---------- */
  function setCam(){
    var cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
    var x = state.dist * cp * Math.sin(state.yaw);
    var y = state.dist * sp;
    var z = state.dist * cp * Math.cos(state.yaw);
    var fx = -x, fy = -y, fz = -z;
    var fl = Math.hypot(fx, fy, fz) || 1; fx /= fl; fy /= fl; fz /= fl;
    // right = normalize(cross(forward, worldUp))
    var rx = fy * 0 - fz * 1, ry = fz * 0 - fx * 0, rz = fx * 1 - fy * 0;
    var rl = Math.hypot(rx, ry, rz) || 1; rx /= rl; ry /= rl; rz /= rl;
    // up = cross(right, forward)
    var ux = ry * fz - rz * fy, uy = rz * fx - rx * fz, uz = rx * fy - ry * fx;
    return { pos:[x,y,z], fwd:[fx,fy,fz], right:[rx,ry,rz], up:[ux,uy,uz] };
  }

  function draw(){
    var c = setCam();
    var W = cv.width, H = cv.height;

    /* 1) 场景 → rtScene（线性 HDR） */
    gl.useProgram(prog);
    gl.bindVertexArray(vao);
    gl.bindFramebuffer(gl.FRAMEBUFFER, post ? rtScene.fb : null);
    gl.viewport(0, 0, W, H);
    if (U.uRes)      gl.uniform2f(U.uRes, W, H);
    if (U.uTime)     gl.uniform1f(U.uTime, state.time);
    if (U.uCamPos)   gl.uniform3f(U.uCamPos, c.pos[0], c.pos[1], c.pos[2]);
    if (U.uCamFwd)   gl.uniform3f(U.uCamFwd, c.fwd[0], c.fwd[1], c.fwd[2]);
    if (U.uCamRight) gl.uniform3f(U.uCamRight, c.right[0], c.right[1], c.right[2]);
    if (U.uCamUp)    gl.uniform3f(U.uCamUp, c.up[0], c.up[1], c.up[2]);
    if (U.uTanHalf)  gl.uniform1f(U.uTanHalf, tanHalf);
    if (U.uSteps)    gl.uniform1i(U.uSteps, state.steps);
    if (U.uDiskIn)   gl.uniform1f(U.uDiskIn, DISK_IN);
    if (U.uDiskOut)  gl.uniform1f(U.uDiskOut, DISK_OUT);
    if (U.uDiskOn)   gl.uniform1f(U.uDiskOn, state.disk ? 1 : 0);
    if (U.uExposure) gl.uniform1f(U.uExposure, state.exposure);
    if (U.uStarBright) gl.uniform1f(U.uStarBright, state.star);
    if (U.uDiskBright) gl.uniform1f(U.uDiskBright, 1.0);
    if (U.uTonemap)  gl.uniform1f(U.uTonemap, post ? 0 : 1);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (!post) return;

    /* 2) 亮度提取 + 1/4 降采样 */
    gl.useProgram(brightP.prog);
    gl.bindFramebuffer(gl.FRAMEBUFFER, rtA.fb);
    gl.viewport(0, 0, rtA.w, rtA.h);
    bindTex(0, rtScene.tex, brightP.u.uSrc);
    gl.uniform2f(brightP.u.uTexel, 1.0 / rtA.w, 1.0 / rtA.h);
    gl.uniform1f(brightP.u.uThresh, 0.82);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    /* 3) 两轮可分离高斯模糊 → 宽而柔的辉光 */
    gl.useProgram(blurP.prog);
    var chain = [[rtA, rtB, 1, 1.35], [rtB, rtA, 0, 1.35],
                 [rtA, rtB, 1, 2.70], [rtB, rtA, 0, 2.70]];
    for (var i = 0; i < chain.length; i++){
      var src = chain[i][0], dst = chain[i][1], horiz = chain[i][2], sc = chain[i][3];
      gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb);
      gl.viewport(0, 0, dst.w, dst.h);
      bindTex(0, src.tex, blurP.u.uSrc);
      gl.uniform2f(blurP.u.uTexel, 1.0 / dst.w, 1.0 / dst.h);
      gl.uniform2f(blurP.u.uDir, horiz ? 1.0 : 0.0, horiz ? 0.0 : 1.0);
      gl.uniform1f(blurP.u.uScale, sc);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    /* 4) 合成 + ACES 色调映射 → 屏幕 */
    gl.useProgram(compP.prog);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, W, H);
    bindTex(0, rtScene.tex, compP.u.uScene);
    bindTex(1, rtA.tex, compP.u.uBloom);
    gl.uniform2f(compP.u.uTexel, 1.0 / W, 1.0 / H);
    gl.uniform1f(compP.u.uBloomAmt, state.bloom);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  var last = 0, ftAcc = 0, ftN = 0, fpsT = 0, fpsN = 0, first = true;

  function frame(now){
    var t = now * 0.001;
    if (!last) last = t;
    var dt = Math.min(0.06, t - last);
    last = t;
    state.time += dt;

    if (state.auto && !dragging) state.tYaw += dt * 0.045;

    var k = Math.min(1, dt * 9);
    state.yaw   += (state.tYaw - state.yaw) * k;
    state.pitch += (state.tPitch - state.pitch) * k;
    state.dist  += (state.tDist - state.dist) * k;

    var t0 = performance.now();
    draw();
    var cost = performance.now() - t0;

    diag.frames++;
    ftAcc += cost; ftN++;
    fpsN++;
    if (t - fpsT > 0.5){
      var fps = fpsN / Math.max(t - fpsT, 1e-3);
      diag.fps = fps;
      document.getElementById('sFps').textContent = fps.toFixed(0) + ' fps';
      fpsT = t; fpsN = 0;
    }
    if (ftN >= 30){
      var avg = ftAcc / ftN;
      ftAcc = 0; ftN = 0;
      if (avg > 30 && state.quality > 0.45){ state.quality = Math.max(0.45, state.quality - 0.08); resize(); }
      else if (avg < 15 && state.quality < 1){ state.quality = Math.min(1, state.quality + 0.05); resize(); }
    }

    if (first){
      first = false;
      setTimeout(function(){
        document.getElementById('veil').classList.add('hide');
        document.getElementById('title').classList.add('on');
        document.getElementById('hint').classList.add('on');
        document.getElementById('panel').classList.add('on');
      }, 260);
    }
    requestAnimationFrame(frame);
  }

  resize();
  diag.steps = state.steps;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
